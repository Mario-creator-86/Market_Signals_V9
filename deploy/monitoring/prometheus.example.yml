global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/market-signals-alerts.yml

scrape_configs:
  - job_name: market-signals
    metrics_path: /api/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/market-signals-metrics-token
    static_configs:
      - targets:
          - app:8003
