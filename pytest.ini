[pytest]
norecursedirs = backups .git .pytest_cache __pycache__ output
testpaths = tests tests_e2e
addopts = -ra
timeout = 60
required_plugins =
    pytest-timeout>=2.0
markers =
    smoke: fast production-readiness smoke tests (<60s target)
    contract: API response contract/schema validation tests
    perf: performance and load guardrail tests
    unit: unit-level deterministic tests
    integration: integration tests against FastAPI test instance
    golden: fixture-based golden output tests
    e2e: browser end-to-end tests
